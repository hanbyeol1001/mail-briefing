[project]
name = "mailbrief"
version = "1.0.0"
description = "사내 그룹웨어 메일 브리핑 봇 (Sentry 실습)"
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.7.0",
    "openpyxl>=3.1.5",
    "playwright>=1.65.2",
    "sentry-sdk>=2.30",
    "sv-ttk>=2.6.1",
    "winotify>=1.1.0",
]

[project.scripts]
mailbrief = "mailbrief.cli:main"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pyinstaller>=6.22.3",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailbrief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
